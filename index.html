<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garmentix — Premium B2B Garment Marketplace</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Garmentix is a premium B2B garment marketplace connecting manufacturers and buyers worldwide. Discover quality garments for bulk orders with real-time production tracking." />
    <meta name="keywords" content="garments, wholesale, B2B, fashion, manufacturer, bulk orders, garmentix" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Garmentix" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Garmentix — Premium B2B Garment Marketplace" />
    <meta property="og:description" content="Connecting garment manufacturers and buyers worldwide. Quality garments, bulk orders, seamless workflow." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://garmentix.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Garmentix — Premium B2B Garment Marketplace" />
    <meta name="twitter:description" content="Connecting garment manufacturers and buyers worldwide." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Google Fonts — non-render-blocking (replaces CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" />

    <!-- Preload LCP hero image (first banner slide) -->
    <link rel="preload" as="image" href="/src/assets/Slide1.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
